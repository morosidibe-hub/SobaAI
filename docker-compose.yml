services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soba}
      POSTGRES_DB: ${POSTGRES_DB:-sobaai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soba} -d ${POSTGRES_DB:-sobaai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soba}:${POSTGRES_PASSWORD:-soba}@db:5432/${POSTGRES_DB:-sobaai}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  pgdata:
